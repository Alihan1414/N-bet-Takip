<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- App Background -->
  <rect width="512" height="512" rx="112" fill="url(#grad)"/>
  
  <!-- Subtle inner card -->
  <rect x="56" y="56" width="400" height="400" rx="80" fill="#0b0f19" opacity="0.35"/>
  
  <!-- Center Icon: Duty Clipboard with Checkmark -->
  <g filter="url(#shadow)">
    <!-- Clipboard Body -->
    <rect x="136" y="110" width="240" height="310" rx="28" fill="#ffffff"/>
    <rect x="156" y="160" width="200" height="230" rx="16" fill="#f3f4f6"/>
    
    <!-- Clipboard Clip -->
    <rect x="196" y="85" width="120" height="50" rx="12" fill="#1e293b"/>
    <circle cx="256" cy="110" r="10" fill="#ffffff"/>
    
    <!-- Checklist items inside clipboard -->
    <rect x="180" y="195" width="130" height="14" rx="7" fill="#10b981"/>
    <circle cx="330" cy="202" r="10" fill="#10b981"/>
    
    <rect x="180" y="240" width="110" height="14" rx="7" fill="#94a3b8"/>
    <circle cx="330" cy="247" r="10" fill="#94a3b8"/>
    
    <rect x="180" y="285" width="140" height="14" rx="7" fill="#10b981"/>
    <circle cx="330" cy="292" r="10" fill="#10b981"/>

    <rect x="180" y="330" width="90" height="14" rx="7" fill="#94a3b8"/>
    <circle cx="330" cy="337" r="10" fill="#94a3b8"/>
  </g>

  <!-- WhatsApp Badge in bottom right corner -->
  <circle cx="390" cy="390" r="68" fill="#25d366" filter="url(#shadow)"/>
